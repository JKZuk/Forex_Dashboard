<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>FX Sentiment Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231a1a19'/%3E%3Crect x='3' y='8' width='3' height='5' fill='%23d95926'/%3E%3Crect x='7' y='3' width='3' height='5' fill='%233987e5'/%3E%3Crect x='11' y='5' width='3' height='3' fill='%233987e5'/%3E%3C/svg%3E" />
    <script>
      // Resolve the theme before first paint (stored choice, else the OS setting).
      (function () {
        var t = null;
        try { t = localStorage.getItem("fx-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
